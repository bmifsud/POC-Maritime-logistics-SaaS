name: ADLC CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Required verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock
      - run: npm --prefix frontend ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Scan source for secrets
        run: python scripts/scan_secrets.py
      - name: Execute all gates and emit evidence
        run: python scripts/emit_evidence.py
      - name: Verify container configuration and preview
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait
          curl --fail http://localhost:8000/api/v1/health
          curl --fail http://localhost:8000/
          curl --fail http://localhost:8000/api/v1/portal/status
      - name: Stop preview
        if: always()
        run: docker compose down
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verification-evidence
          path: |
            .adlc/evidence/
            artifacts/
          include-hidden-files: true
