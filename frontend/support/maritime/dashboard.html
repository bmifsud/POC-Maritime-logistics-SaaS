<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maritime QA Control</title>
<style>*{box-sizing:border-box}body{font:18px system-ui;background:#0f172a;color:#e2e8f0;padding:1rem;margin:0}main{max-width:44rem;margin:auto;min-width:0}#revision{overflow-wrap:anywhere}button,a{display:block;width:100%;padding:1rem;margin:.8rem 0;border:0;border-radius:.5rem;background:#0369a1;color:white;font:inherit;text-align:center}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#020617;padding:1rem;max-height:45vh;overflow:auto}a[hidden]{display:none}#state{padding:1rem;border-radius:.6rem;border:1px solid #64748b;overflow-wrap:anywhere}#state[data-result="passed"]{background:#14532d;color:#dcfce7;border-color:#4ade80}#state[data-result="failed"]{background:#7f1d1d;color:#fee2e2;border-color:#f87171}#state[data-result="running"]{background:#1e3a5f;color:#e0f2fe}select{width:100%;padding:.8rem;font:inherit}</style>
<main><h1>Maritime QA demo</h1><p>Android controls Linux Playwright. All booking data is synthetic.</p><p id="state" role="status">Connecting…</p><label for="branch">Approved branch</label><select id="branch" style="width:100%;padding:1rem;font:inherit"></select><button id="refresh">Refresh branches</button><p id="revision"></p><label for="test">Test scenario</label><select id="test"><option value="all">All maritime tests</option><option value="offline">Offline booking recovery</option><option value="provider">Provider API mock</option><option value="date">Port-local date</option><option value="timezone">Browser timezone override</option></select><button id="run" disabled>Run maritime demo</button><button id="reset">Reset displayed result</button><a id="report" hidden target="_blank" rel="noopener">Open this run's report</a><pre id="output">Checking controller…</pre></main>
<script>
const csrf='__CSRF__',state=document.querySelector('#state'),out=document.querySelector('#output'),run=document.querySelector('#run'),reset=document.querySelector('#reset'),report=document.querySelector('#report');
const branch=document.querySelector('#branch'),revision=document.querySelector('#revision');let branches=[];
async function refreshBranches(){try{const r=await fetch('/api/branches',{signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok)throw Error(d.error);branches=d.branches;branch.replaceChildren(...branches.map(x=>{const o=document.createElement('option');o.value=x.branch;o.textContent=x.branch;return o}));showRevision()}catch(e){state.textContent=e.message;branches=[];run.disabled=true}}
function showRevision(){revision.textContent=branches.find(x=>x.branch===branch.value)?.revision||'No branch available'}
branch.onchange=showRevision;document.querySelector('#refresh').onclick=refreshBranches;refreshBranches();
let busy=false;
async function action(endpoint){try{const r=await fetch('/api/'+endpoint,{method:'POST',headers:{'x-csrf-token':csrf,'content-type':'application/json'},body:JSON.stringify(endpoint==='run'?{...branches.find(x=>x.branch===branch.value),test:document.querySelector('#test').value}:{})});const d=await r.json();if(!r.ok)throw Error(d.error);await poll()}catch(e){state.textContent=e.message}}
run.onclick=()=>action('run');reset.onclick=()=>action('reset');
async function poll(){if(busy)return;busy=true;try{const r=await fetch('/api/status',{signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error('Controller unavailable');const d=await r.json(),x=d.active||d.last;run.disabled=!!d.active||!branches.length;branch.disabled=!!d.active;document.querySelector('#test').disabled=!!d.active;state.dataset.result=x?.status||'idle';reset.disabled=!!d.active;state.textContent=x?`${x.status.toUpperCase()} · ${x.branch||'legacy'} · ${x.test||'all'} · ${x.id} · ${x.startedAt}`:'Ready — run deterministic checks';out.textContent=x?`${x.revision} (dirty: ${x.dirty})\n${x.output}`:'No run yet. Browser and dependencies must be installed before the interview.';report.hidden=!d.last||!!d.active;if(d.last)report.href='/reports/'+d.last.id+'/index.html'}catch(e){state.dataset.result='failed';state.textContent='Disconnected — reconnect SSH tunnel; Linux run continues';run.disabled=true;report.hidden=true}finally{busy=false}}
poll();setInterval(poll,1000);
</script></html>
