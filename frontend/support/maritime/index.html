<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maritime Booking Demo</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #e2e8f0; background: #0f172a; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(92vw, 680px); padding: 2rem; background: #1e293b; border-radius: 1rem; }
      label { display: grid; gap: .4rem; margin: 1rem 0; }
      input, button { font: inherit; min-height: 2.9rem; border-radius: .5rem; border: 1px solid #64748b; padding: 0 .8rem; }
      button { cursor: pointer; color: #fff; background: #0369a1; border: 0; font-weight: 700; }
      button:disabled { cursor: wait; opacity: .6; }
      .status { padding: .8rem; border-radius: .5rem; background: #334155; }
      [data-status='synced'] { background: #166534; }
      [data-status='pending-sync'] { background: #854d0e; }
      .meta { color: #cbd5e1; }
    </style>
  </head>
  <body>
    <main>
      <h1>Maritime Booking Console</h1>
      <p class="meta">Authenticated local resilience demonstration</p>
      <p id="connection" class="status">Online</p>
      <p id="booking-status" class="status" data-status="idle">No booking queued</p>
      <form id="booking-form" aria-label="Create booking">
        <label>Vessel <input name="vessel" value="MV Deterministic" required /></label>
        <label>Port <input name="port" value="Auckland" required /></label>
        <button type="submit">Create booking</button>
      </form>
      <button id="retry" type="button">Retry synchronization</button>
      <p id="port-time" class="meta"></p>
    </main>
    <script type="module">
      const queueKey = 'maritime-booking-queue';
      const bookingKey = 'maritime-booking';
      const form = document.querySelector('#booking-form');
      const status = document.querySelector('#booking-status');
      const connection = document.querySelector('#connection');
      const portTime = document.querySelector('#port-time');
      const setStatus = (text, state) => { status.textContent = text; status.dataset.status = state; };
      const readQueue = () => JSON.parse(localStorage.getItem(queueKey) || '[]');
      const writeQueue = (items) => localStorage.setItem(queueKey, JSON.stringify(items));
      const render = () => {
        const booking = JSON.parse(localStorage.getItem(bookingKey) || 'null');
        if (booking) setStatus(booking.status === 'synced' ? 'Synced' : 'Pending sync', booking.status);
        connection.textContent = navigator.onLine ? 'Online' : 'Offline';
        portTime.textContent = `Port-local date: ${new Intl.DateTimeFormat('en-NZ', { timeZone: 'Pacific/Auckland', dateStyle: 'full' }).format(new Date('2026-11-07T23:30:00.000Z'))}`;
      };
      let syncing = false;
      const sync = async () => {
        if (syncing) return;
        syncing = true;
        try {
        const queue = readQueue();
        if (!queue.length) return;
        for (const booking of queue) {
          const response = await fetch('/api/bookings/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(booking) });
          if (!response.ok) throw new Error(`Sync failed: ${response.status}`);
          const result = await response.json();
          localStorage.setItem(bookingKey, JSON.stringify(result.booking));
        }
        writeQueue([]); render();
        } finally { syncing = false; }
      };
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const booking = { id: 'booking-demo-001', vessel: formData.get('vessel'), port: formData.get('port'), status: 'pending-sync' };
        localStorage.setItem(bookingKey, JSON.stringify(booking)); writeQueue([booking]); render(); if (navigator.onLine) sync().catch(() => setStatus('Pending sync', 'pending-sync'));
      });
      document.querySelector('#retry').addEventListener('click', () => sync().catch(() => setStatus('Pending sync', 'pending-sync')));
      window.addEventListener('online', () => { render(); if (navigator.onLine) sync().catch(() => setStatus('Pending sync', 'pending-sync')); });
      window.addEventListener('offline', render); render();
    </script>
  </body>
</html>
